name: Deploy AI chat worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_GEM: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          echo "::notice::CF token lines=$(printf '%s\n' "$RAW_CF" | grep -c .) chars=${#RAW_CF}; Gemini lines=$(printf '%s\n' "$RAW_GEM" | grep -c .) chars=${#RAW_GEM}"
          CF=$(printf '%s' "$RAW_CF" | head -n1 | tr -d '[:space:]')
          GEM=$(printf '%s' "$RAW_GEM" | head -n1 | tr -d '[:space:]')
          kind(){ case "$1" in cfut_*|cfat_*) echo cloudflare;; AIza*|AQ.*) echo google;; *) echo unknown;; esac; }
          echo "::notice::CLOUDFLARE_API_TOKEN looks like: $(kind "$CF") / GEMINI_API_KEY looks like: $(kind "$GEM")"
          if [ "$(kind "$CF")" = google ] && [ "$(kind "$GEM")" = cloudflare ]; then T="$CF"; CF="$GEM"; GEM="$T"; echo "::warning::The two secrets were swapped - using them the right way round."; fi
          [ -n "$CF" ] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          [ -n "$GEM" ] || { echo "::error::GEMINI_API_KEY missing"; exit 1; }
          echo "::add-mask::$CF"; echo "::add-mask::$GEM"
          echo "CLOUDFLARE_API_TOKEN=$CF" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=$GEM" >> "$GITHUB_ENV"
      - name: Register workers.dev subdomain (first time only)
        run: |
          ACC=a06c08092e0426b9fa00f162cbf261f5
          API=https://api.cloudflare.com/client/v4/accounts/$ACC/workers/subdomain
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | python3 -c "import sys,json;d=json.load(sys.stdin);print((d.get('result') or {}).get('subdomain') or '')")
          if [ -n "$CUR" ]; then echo "::notice::workers.dev subdomain = $CUR"; exit 0; fi
          for NAME in ive-entertainment iveent ive-ent-2019; do
            R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NAME\"}" $API)
            if echo "$R" | grep -q '"success":true'; then echo "::notice::registered workers.dev subdomain = $NAME"; exit 0; fi
            echo "::warning::$NAME failed: $(echo "$R" | python3 -c "import sys,json;print(json.load(sys.stdin).get('errors'))")"
          done
          exit 1
      - name: Deploy worker
        run: |
          set -o pipefail
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log || { tail -n 15 deploy.log | sed 's/^/::error::/' ; exit 1; }
          grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1 | sed 's/^/::notice::WORKER_URL=/' || true
      - name: Set Gemini secret
        run: |
          set -o pipefail
          printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@4 secret put GEMINI_API_KEY 2>&1 | tee secret.log || { tail -n 15 secret.log | sed 's/^/::error::/' ; exit 1; }
      - name: Smoke test
        run: |
          sleep 10
          R=$(curl -s -m 60 -X POST https://ive-chat.ive-entertainment.workers.dev/chat -H "Origin: https://ive-entertainment.com" -H "Content-Type: application/json" -d '{"messages":[{"role":"user","content":"크리에이터 지원은 어떻게 하나요?"}]}' -w ' HTTP%{http_code}')
          echo "::notice::TEST=$(echo "$R" | tr '\n' ' ' | cut -c1-600)"
          F=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://ive-chat.ive-entertainment.workers.dev/chat -H "Origin: https://evil.example" -d '{}')
          echo "::notice::OTHER_ORIGIN_STATUS=$F"
