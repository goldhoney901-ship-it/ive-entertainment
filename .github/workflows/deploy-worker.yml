name: Deploy AI chat worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RAW_CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RAW_GEM: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check secrets
        run: |
          echo "::notice::CF token lines=$(printf '%s\n' "$RAW_CF" | grep -c .) chars=${#RAW_CF}; Gemini lines=$(printf '%s\n' "$RAW_GEM" | grep -c .) chars=${#RAW_GEM}"
          CF=$(printf '%s' "$RAW_CF" | head -n1 | tr -d '[:space:]')
          GEM=$(printf '%s' "$RAW_GEM" | head -n1 | tr -d '[:space:]')
          [ -n "$CF" ] || { echo "::error::CLOUDFLARE_API_TOKEN missing"; exit 1; }
          [ -n "$GEM" ] || { echo "::error::GEMINI_API_KEY missing"; exit 1; }
          echo "::add-mask::$CF"; echo "::add-mask::$GEM"
          echo "CLOUDFLARE_API_TOKEN=$CF" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=$GEM" >> "$GITHUB_ENV"
      - name: Deploy worker
        run: |
          set -o pipefail
          npx -y wrangler@4 deploy 2>&1 | tee deploy.log || { tail -n 15 deploy.log | sed 's/^/::error::/' ; exit 1; }
          grep -o 'https://[a-zA-Z0-9.-]*workers.dev' deploy.log | head -1 | sed 's/^/::notice::WORKER_URL=/' || true
      - name: Set Gemini secret
        run: |
          set -o pipefail
          printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@4 secret put GEMINI_API_KEY 2>&1 | tee secret.log || { tail -n 15 secret.log | sed 's/^/::error::/' ; exit 1; }
